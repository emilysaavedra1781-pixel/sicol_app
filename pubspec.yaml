name: sicol_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.4
  cloud_firestore: ^5.6.2
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.10.0
  cloud_functions: ^5.6.2
  http: ^1.1.0
  geolocator: ^13.0.1
  firebase_messaging: ^15.2.1
  image_picker: ^1.1.2
  firebase_storage: ^12.3.7
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/